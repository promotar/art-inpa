name: art-inpa-local

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  env_file:
    - .env
  volumes:
    - ./:/var/www/html
    - ./public:/var/www/public_html
  networks:
    - app-internal
    - vps-internal
  restart: unless-stopped

services:
  app:
    <<: *php-service
    container_name: art-inpa-app
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: art-inpa-web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./:/var/www/html:ro
      - ./public:/var/www/public_html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  queue:
    <<: *php-service
    container_name: art-inpa-queue
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=180"]

  scheduler:
    <<: *php-service
    container_name: art-inpa-scheduler
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]

  vite:
    image: node:22-alpine
    container_name: art-inpa-vite
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/var/www/html
      - art-inpa-node-modules:/var/www/html/node_modules
    networks:
      - app-internal
    restart: unless-stopped

networks:
  app-internal:
    name: art-inpa-internal
  vps-internal:
    external: true

volumes:
  art-inpa-node-modules:
    name: art-inpa-node-modules
