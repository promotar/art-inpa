name: art-inpa-production

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  env_file:
    - .env
  volumes:
    - ./:/var/www/html
  networks:
    - app-internal
    - vps-internal
  restart: unless-stopped

services:
  app:
    <<: *php-service
    container_name: art-inpa-app
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: art-inpa-web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  queue:
    <<: *php-service
    container_name: art-inpa-queue
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=180"]

  scheduler:
    <<: *php-service
    container_name: art-inpa-scheduler
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]

networks:
  app-internal:
    driver: bridge
  vps-internal:
    external: true

volumes:
  art-inpa-persistent-storage:
    driver: local
